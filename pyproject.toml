[project]
name = "firelens"
version = "1.0.0"
description = "Local-first hybrid code retrieval for coding agents"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
    { name = "Ali Aslanbayli" },
]
keywords = [
    "code-search",
    "mcp",
    "retrieval",
    "semantic-search",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "einops>=0.8.2",
    "mcp>=2,<3",
    "numpy>=2.4,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.3,<3",
    "sentence-transformers>=5.6.0,<6",
    "streamlit>=1.58,<2",
]

[project.optional-dependencies]
mojo = [
    "mojo==1.0.0",
]
legacy = [
    "fastapi[standard]>=0.138,<0.139",
    "openai>=2.44,<3",
    "requests>=2.32,<3",
]

[project.scripts]
firelens = "app.interfaces.cli:main"
firelens-mcp = "app.interfaces.mcp_server:main"

[project.urls]
Homepage = "https://github.com/aslanbayli/firelens"
Repository = "https://github.com/aslanbayli/firelens.git"
Issues = "https://github.com/aslanbayli/firelens/issues"
Changelog = "https://github.com/aslanbayli/firelens/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
